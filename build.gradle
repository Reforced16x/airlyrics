plugins {
    id 'java'
    id 'fabric-loom' version "${loom_version}"
    id 'ploceus' version "${ploceus_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Legacy Fabric'
        url = 'https://maven.legacyfabric.net'
    }
    maven {
        name = 'Ornithe Releases'
        url = 'https://maven.ornithemc.net/releases'
    }
    maven {
        name = 'Ornithe Snapshots'
        url = 'https://maven.ornithemc.net/snapshots'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

ploceus {
    setGeneration(2)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings ploceus.featherMappings(project.feather_build)

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
